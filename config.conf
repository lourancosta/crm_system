APPLICATION_NAME="crm"
SERVICE_TYPE="ClusterIP"
HPA_ENABLED="true"
DEV_REPLICAS=1
MAX_DEV_REPLICAS=1
HML_REPLICAS=1
MAX_HML_REPLICAS=1
PRD_REPLICAS=1
MAX_PRD_REPLICAS=1
READINESS_PROBE_HTTP_PATH="/healthz"
LIVENESS_PROBE_HTTP_PATH="/healthz"

# App now listens on 80 (Dockerfile: EXPOSE 80 / server.ts: PORT ?? 80),
# matching the chart's own default for SERVICE_PORT/probe ports/externalPort
# — no override needed. (Previously the app listened on 3000, requiring
# SERVICE_PORT=3000 + LIVENESS_PROBE_HTTP_PORT=3000 +
# READINESS_PROBE_HTTP_PORT=3000 here so the Service's targetPort and the
# probes matched the app's real listening port instead of the chart's 80
# default; removed now that they'd match anyway.)
